# ntime CI.
#
# EVERY INPUT IS PINNED, AND EVERY PIN IS ASSERTED RATHER THAN REQUESTED (0.0.1
# P-10; D-204, which makes the toolchain a build input). The compiler is a
# COMMIT, never a branch: `nitpick` is still moving -- through its cycle 1.6
# at this pin (this said "its cycle 1.5" until cycle 0.1.5) -- and a
# library whose CI tracks another repository's `main` is a library whose CI goes
# red for reasons that are not its own. Bumping either pin is a deliberate
# commit, and the commit that bumps it is the one that runs the full suite.
#
# ============================================================================
# THE TWO CONDITIONS THIS FILE EXISTS TO WRITE DOWN
# ============================================================================
# A green run here may be read as "ntime builds against compiler 5fbaf4a" only
# because BOTH of the following are stated AND enforced below. Either one
# missing and the claim is weaker than it sounds.
#
#   (1) LLVM 20.1.2 EXACTLY -- the patch release included. A patch release can
#       change instruction selection, so "LLVM 20" is not a pin. `nitpick.toml`
#       [toolchain] names three digits for this reason, and the step below
#       FAILS on any other version rather than reporting it.
#
#   (2) THE BUILD LADDER IS INVOKED FROM THE COMPILER TREE ROOT. The compiler
#       is built by its own bootstrap ladder and by nothing else; the ladder's
#       entry point takes a path relative to the working directory, so the
#       working directory is part of the recipe. The step below sets it and
#       then asserts it, because `working-directory:` silently succeeding at
#       the wrong place is the failure mode that would make the artefacts a
#       build of something other than what the pin names.
#
# The workbench measured that a fresh detached worktree at this commit, with
# nothing uncommitted, driven through that ladder, reproduces the two pinned
# artefacts. That is why the claim is available at all. It was measured THERE,
# on one machine, and this file does not assume it holds HERE -- see the digest
# step near the end, which reports rather than asserts, and says why. *(Since
# 2026-09-27, cycle 0.2.0a, that step ASSERTS the compiler's emission, `npkc.ll`,
# against the pinned commit's row -- the claim the compiler's D-265 says holds
# across machines -- and prints the binaries, which need not match: TM-212.)*
# ============================================================================
#
# WHAT A GREEN RUN PROVES TODAY. `src/core/` is real code since cycle 0.0.4 --
# `Vec<T>`, `Bytes` and fifteen named constants, thirteen bounds and two unit
# conversions, thirteen in all until 0.2.3 added `Duration`'s two ends (it
# said "fifteen named bounds" from 0.2.3 to 0.2.4a, the cycle audit's K5) --
# and `src/cal/` since 0.1.0 --
# the civil types and their validating constructors, and since 0.1.1 Hinnant's
# `date_to_days` and `days_to_date`, and since 0.1.3 the derived fields --
# and `src/span/` since 0.2.0, `Instant` and its four operations, and since
# 0.2.1 `Timestamp` and its constructor, since 0.2.2 the two conversions
# between a `Timestamp` and its civil reading, and since 0.2.3 the `Duration`
# interop -- and `src/host/` since 0.3.0, the clocks --
# re-exported together as 81 public names [[sweep: lib_reexports=81]],
# so this IS evidence about behaviour, of the 134 units the runner reports at
# compiler `5fbaf4a` since cycle 0.3.0 (133 at cycles 0.2.4b and 0.2.4, 131 at cycles 0.2.3 and 0.2.4a, 126 at cycles 0.2.2 and 0.2.3a, 122 at cycle 0.2.1, 114 at cycle 0.2.0, 111 at 0.2.0b, 113 at 0.2.0a and at
# `c970483` at cycle 0.1.5's second half; 62 at cycle 0.0.6, 67 at 0.1.0,
# 70 at 0.1.0b, 75 at 0.1.0c, 78 at 0.1.1, 81 at 0.1.2, 86 at 0.1.3, 90 at
# 0.1.3b, 91 at 0.1.4 and 0.1.4b, all at `c3bdae2` from 0.1.0b on, 101 at
# 0.1.4c, and 112 at 0.1.3c and at the first half of 0.1.5, cycle 0.1's
# close). What
# it is evidence of: the pinned compiler builds from a clean checkout at exactly
# LLVM 20.1.2, every `.npk` under `src/` compiles, every unit under `tests/`
# meets its own header at -O0 and again under `opt -O2`, the whole
# `tests/probe/defect/` regression corpus meets its markers (TM-141), and
# `tests/conformance/import.npk` emits, assembles, links, RUNS and exits 0. The
# run is what is judged -- `npkc` exiting 0 is NOT well-formedness (O-N11,
# TM-112), and a stage that stopped at the `.ll` would have passed a program
# with no handler. AND SINCE CYCLE 0.1.0b: every `while` in the tree states a
# measure the compiler checks on every trip (D-304, `DecreasesViolated`), and
# every `failsafe` names the two identities the compiler's 1.5 added to the
# floor, `StackExhausted` and `MachineFault` -- the pinned compiler refuses a
# tree missing either, so a green run here is a tree that has both. (The
# first half said "every loop" until cycle 0.1.2, whose sweeps added six
# `for` loops over ranges: a `for` is bounded by construction and states no
# measure, and the tree had held one since cycle 0.0.0.) AND SINCE
# CYCLE 0.1.0c: `Vec<T>`'s pointer is `hidden`, the lengths of `Vec` and
# `Bytes` are `sealed limit<ListLen>`, and every field of `CivilDate` and
# `CivilTime` is `sealed` -- five probes assert that the pinned compiler
# refuses a consumer's write or hidden read, one that the reads still work,
# and every root that consumes `src/core/` names `LimitViolated`. AND SINCE
# CYCLE 0.1.1: the range constants are recomputed from the calendar algorithm
# rather than trusted (TM-161), twenty-six day numbers computed without
# Hinnant's formula are asserted both ways, and every divisor in `src/cal/`
# is a positive integer literal, checked (TM-163). AND SINCE CYCLE 0.1.2:
# every day number and every date in the range round-trips on both legs,
# 7 304 484 of each [[sweep: domain_every_day_number=7304484]], and every one of
# the 239 988 months [[sweep: domain_every_month_length=239988]] has the length
# the month table and Hinnant both give it -- the three `tests/unit/sweep/`
# members, each printing the count it visited (TM-122), and each assertion in
# them seen to fail on a mutant (`meta/roadmap/done/0.1/0.1.2.md` §5).
# AND SINCE CYCLE 0.1.3: every date's weekday is the one seven-day cycle begun
# on the range's first Monday, and every date in the range
# goes to its ordinal date and back, 7 304 484 of them  [[sweep: domain_every_ordinal_date=7304484]]
# and to its ISO week date and back, 7 304 484 of them  [[sweep: domain_every_iso_week_date=7304484]]
# -- each compared with a walk of its own rule rather than with itself, the
# day after every year's last and the week after every week-year's last
# refused, and each assertion seen to fail on a mutant
# (`meta/roadmap/done/0.1/0.1.3.md` §7). AND SINCE CYCLE 0.1.3b: no `fixed` table
# may hold an owning value, as its element or at any depth of it (`SAFETY.md`
# S-19b), and a `move` out of `fixed` storage -- a compiler defect, O-N20,
# the compiler's DEF-99 -- is
# reproduced in `tests/probe/defect/fixed_move_out/`, each case's verdict
# re-derived on every run, so the day the compiler refuses the move, this run
# says so. AND SINCE CYCLE 0.1.4: every date from 0001-01-01 to 9999-12-31,
# the whole of Python's range, 3 652 059 of them  [[sweep: domain_every_oracle_date=3652059]]
# -- agrees with Python's `datetime` in its year, month, day, day number,
# weekday, ISO week date and day of the year, by a digest per year of a
# corpus generated from `datetime` (`tests/fixtures/civil/`, `TESTING.md` V-6),
# each assertion seen to fail on a mutant (`meta/roadmap/done/0.1/0.1.4.md` §7).
# The negative half of the range has the round trips above and nothing
# external: Python stops at year 1. AND SINCE CYCLE 0.1.4c, AT COMPILER
# `c970483`: the day the 0.1.3b sentence above waited for has come -- a move
# out of `fixed` storage is refused, `NITPICK-TYPE-084`, and each of
# `fixed_move_out/`'s three cases asserts that refusal by its marker; and an
# imported `fixed` binding's type resolves in its declaring module, asserted
# by the seven cases of `tests/probe/defect/fixed_import_scope/` (O-N23).
# AND SINCE CYCLE 0.1.3c: a `Vec` is move-only -- a copy of one, one assigned
# over another and a copy of a struct holding one are refused where they are
# written -- and `vec_at` at an owning element is refused at the call rather
# than moving the element out, each asserted by a refusal probe (TM-193,
# TM-194). AND SINCE CYCLE 0.1.5: every `.npk` the runner reads, it reads as
# the compiler does -- bytes, comments and literals by the lexer's rules,
# import paths decoded (`harness/lexical.py`, `TESTING.md` V-1k) -- and every
# tree check matches tokens across the lexer's whitespace, never a line
# (V-1l). Before it, eight shapes of source made the runner disagree with
# the compiler, and six of them passed a violation silently. AND SINCE CYCLE
# 0.2.0a, AT COMPILER `5fbaf4a`: every emission states the pinned target and
# the runner holds it there (`BUILD.md` B-1a); every refusal names each code
# once per site it is reported at (B-7c); and `vec_at` takes the prelude's
# `Copy` (TM-209 … TM-211). AND SINCE CYCLE 0.2.0b: `Vec<T: Copy>` -- an
# owning element is refused at the type and at every verb, not only at
# `vec_at`'s call (TM-214). AND SINCE CYCLE 0.2.1: every `Timestamp` a
# consumer can hold is normalised -- `timestamp_of` refuses what it would have
# to carry, at every boundary it decides, and the seal refuses a literal and a
# write -- and an `Instant` and a `Timestamp` convert into each other neither
# at the type nor through `=>!`, in either direction, each refusal asserted by
# a probe of its own (TM-219 ... TM-221). AND SINCE CYCLE 0.2.2: a `Timestamp`
# goes to its civil reading in UTC and back, both sides of every day boundary
# in the range, 7 304 484 dates [[sweep: domain_every_day_boundary=7304484]],
# and every second of 512 days a seeded generator chooses, 44 236 800 of them
# [[sweep: domain_every_sampled_second=44236800]] -- each direction handed a
# walk's value, never the other's answer -- and every `Timestamp` the
# conversion back returns is normalised, its refusals seen on readings forged
# through the language's opt-out (TM-222 ... TM-225). AND SINCE CYCLE 0.2.3a:
# the tree checks' four statements -- `TESTING.md` §2, `checks.LIVE`,
# `checks.PENDING` and what the runner drives outside step 5 -- are one list,
# diffed on every run (TM-227); no function in `src/` returns a view but
# `bytes_view`, whose exemption is re-derived (TM-228); `int128` stands in
# `src/` only at the sites `SPAN_MODEL.md` §5 marks (TM-229, TM-230); and no
# owned number is spelled outside its module in any spelling the compiler
# reads, hex and digit separators included (TM-231, TM-232). AND SINCE CYCLE
# 0.2.3: every `Duration` constructor gives exactly its argument's
# nanoseconds across its range -- every argument, and every 262nd minute --
# and a day traps one past either end;
# `timestamp_add` keeps every answer normalised over a hundred thousand
# seeded additions and forged inputs; and `timestamp_since` answers at
# `Duration`'s two ends exactly and refuses one nanosecond past them, never
# wrapping (TM-233 ... TM-236). AND SINCE CYCLE 0.2.4a: an owned number is
# held to its owner's file and every bound to its value, an optional of a view
# is a view, and every integer wider than `int64` stands only where §5 marks
# (TM-238 ... TM-240). AND SINCE CYCLE 0.2.4b: `timestamp_add` refuses a
# forged operand at `int64`'s ends rather than trapping; `instant_since`
# answers at `Duration`'s two ends exactly and refuses one nanosecond past
# them; and a consumer's construction of an `Instant` from a `Timestamp`'s
# numbers compiles and runs, which M-3 now says (TM-241 ... TM-243). AND
# SINCE CYCLE 0.3.0: a literal of a width past `int64` -- `3i256` -- is held to
# §5's sites as the type's name is, where a computation of literals alone
# narrowed a constant in silence and passed every check (TM-246); and the
# clocks: each reading of the clock it names, the realtime one range-checked
# by `timestamp_of`, each ADVANCING within a million reads -- forty runs a leg
# -- and each resolution in (0, 1 s] (TM-247 ... TM-249). WHAT THE THREE
# CLAUSES ABOVE ON WIDE INTEGERS HOLD IS WHAT IS SPELLED -- a wide type's name,
# and since 0.3.0 a literal's width: a wide value no width is spelled for, a
# call's result multiplied in a function §5 does not mark, passes this run, and
# always has (`meta/OPEN_QUESTIONS.md` O-X11, dormant; found by 0.3.0's
# verification, 2026-10-08). AND SINCE CYCLE 0.3.1, WHAT IS EMITTED AS WELL:
# every integer wider than `i64` in `npkc`'s emission of a function of the
# umbrella stands where §5 marks, spelled or not, so that call's result is a
# finding (TM-251, O-X11 answered); and no function of `src/` outside
# `src/host/` reaches, in that emission, a runtime symbol outside a reviewed
# allowlist -- the kernel, the clock, the environment, a descriptor -- whatever
# name it reaches it through (TM-250, O-X9 answered). And `check_purity`'s list
# is every builtin and every synchronous public prelude function at the pin
# that reaches past the program's own memory, where it was six names -- the
# asynchronous ones that do and are not on it, named in TM-252's dated note,
# are callable only from an `async func`, which `check_call_edges` refuses in
# `src/` unless it is generic -- a hole dormant while `src/` has no
# asynchronous function (until 0.3.1's verification this said "every builtin
# and prelude function") -- and `check_host_isolation` reads every name
# `src/host/` makes public (TM-252, TM-253).
#
# AND, SINCE CYCLE 0.0.3, IT IS ALSO EVIDENCE THAT THE RUNNER CAN FAIL. The
# harness's first step is `harness/selfcheck.py` (`meta/specs/TESTING.md` V-14,
# V-15): TWELVE of V-14's thirteen faults planted in scratch trees (eight of
# nine from cycle 0.1.4b's case 9, a program whose managed memory disagrees
# with its header, until cycle 0.2.0a's four -- two target pins, two site
# counts, TM-209 and TM-210; seven of eight before) -- case 6 is
# `PEND` until cycle 0.5 and prints as pending rather than passing -- each
# requiring a RED run that names it AND a green control beside it; then one
# planted violation per tree check -- more than one where a check has two
# spellings or a branch no plant can express -- each with a clean control
# beside it; then the S-6 arm generator diffed
# against the compiler's own `NITPICK-REACH-003` identity list; then the
# verdict mechanisms of TM-137 and TM-141 driven red; then, since cycle
# 0.1.5, the reader asked about one text of every lexical form and the
# pinned compiler about one program of the forms a run can observe that the
# self-check names -- each literal's value asserted since the close's second
# half (TM-202), which is what turns a lexer move on one of them red; a move
# on a form the program does not hold is the adoption's to find, by reading
# the compiler's lexer. And since cycle 0.2.3a part E asks the literal
# reader `check_constants_named` uses, and the pinned compiler, about one
# program of every spelling of a number (TM-231). It runs FIRST and its
# failure is fatal, so
# a green run below a broken runner is not a state this workflow can report.
# Until 0.0.3 that was the honest gap here, and it was written in this comment
# for three cycles.
#
# WHAT IT IS STILL NOT EVIDENCE OF. Two of the six `src/` directories are
# still placeholders -- `zone/` and `fmt/` (three, `host/` among them, until
# cycle 0.3.0 gave it the clocks) -- and `span/` holds `Instant`
# since cycle 0.2.0, `Timestamp` since 0.2.1, the conversions between a
# `Timestamp` and its civil reading since 0.2.2 and the `Duration` interop
# since 0.2.3, so nothing here converts a
# time to a zone, or between a time and text. (It said "a timestamp to a date"
# too, and "no conversion between the scales", until cycle 0.2.2; it said
# `Instant` alone until cycle
# 0.2.1, and four placeholders, `span/` among them, until cycle 0.2.0. This
# said five placeholders, `cal/` among them, until cycle 0.1.0b; `cal/` had had
# a body since 0.1.0. And until cycle 0.1.2 it said `cal/` held "the types and
# constructors but not yet the day-number algorithms (cycle 0.1.1), so nothing
# here converts a date to a day" -- false since 0.1.1, which added them.) And
# a green run is not a MEMORY result for the managed
# half: D-151's exit-0 trap counts `wild` allocations and a `buffer` is managed
# (TM-106), so `exit 0` says nothing about `Bytes` (S-18b, S-18e) -- except
# that, since cycle 0.1.4b, the files whose headers bound it -- six since
# cycle 0.2.0b [[sweep: heap_bounded=6]], eight from cycle 0.1.3c until it
# retired the churn pair (TM-214) -- are held on both legs to the runtime's
# own NPK_HEAP_STATS count, and four of them
# [[sweep: cap_belted=4]] again under a 64 MiB cap (`TESTING.md` V-17).
#
# NOT PINNED, AND KNOWN: `actions/checkout@v4` and `actions/cache@v4` are moving
# tags -- the only inputs in this file that are not immutable. A workflow this
# insistent about pinning a compiler by sha and LLVM by patch release should not
# be surprised when the parts left on a floating tag roll forward underneath it.
# The sibling library records that GitHub already annotates both for a Node
# runtime deprecation; nothing is broken and there is nothing to do until the
# forcing ends, at which point the fix is to bump both.

name: ntime

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # ../BOARD.md's pinned toolchain, by FULL sha. `5fbaf4a` is the short form
  # used in the roadmap and in the transcripts.
  #
  # THIS PIN WAS `0dfddac` UNTIL CYCLE 0.0.6 AND THE COMMENT ABOVE WAS FALSE
  # WHILE IT WAS (TM-140). The board moved to `aaffb87` on 2026-09-05 and this
  # file did not; nothing noticed, because a workflow that has never run cannot
  # go red. Bumping either pin is a deliberate commit, and this is that commit:
  # the whole suite was run at `aaffb87` before it was made, and the audit
  # additionally built the library and every runnable unit at `0dfddac`, so the
  # content is known pin-portable and what was wrong was only the pin.
  #
  # AND IT WAS `aaffb87` UNTIL CYCLE 0.1.0b. This commit moves it to `c3bdae2`,
  # the compiler's 1.5 close, and it is deliberately RED on its own: the tree
  # it pins is not yet adopted. It is pushed only together with the adoption,
  # so CI runs once, on the adopted tree (`meta/roadmap/done/0.1/0.1.0b.md` §3).
  #
  # AND IT WAS `c3bdae2` UNTIL CYCLE 0.1.4c, which moves it to `c970483`, the
  # end of the compiler's 1.6.0 chain -- IN THE ADOPTION'S OWN COMMIT this
  # time, not before it: the adopted tree is RED at `c3bdae2`, where
  # `fixed_move_out/`'s moves still compile, and the unadopted tree is RED at
  # `c970483`, so the pin and the tree it judges move in one commit and CI
  # never pairs either with the other's (`meta/roadmap/done/0.1/0.1.4c.md` §3).
  #
  # AND IT WAS `c970483` UNTIL CYCLE 0.2.0a, which moves it to `5fbaf4a`, the
  # compiler's last landing before its pause (the board's notice 82) -- IN A
  # COMMIT OF ITS OWN, after the adoption's four and before the step below
  # asserts the new pin's emission: the adopted tree is RED at `c970483`, whose
  # emissions state no `target` line for the runner to hold (TM-209), and the
  # unadopted tree is RED at `5fbaf4a`, where fifteen `cstring` copies are
  # refused (TM-208). All of them are pushed together, so CI runs once, on the
  # adopted tree (`meta/roadmap/done/0.2/0.2.0a.md` §3).
  NITPICK_COMMIT: 5fbaf4a40a2f6b213754cd71b6c69700f8aa2c87
  NITPICK_COMMIT_SHORT: 5fbaf4a
  # nitpick.toml [toolchain] llvm. Condition (1) above.
  LLVM_VERSION: 20.1.2
  # The digests of the artefacts the workbench pins, from
  # ../.internal/toolchain/5fbaf4a/SHA256SUMS. Reported against CI's own, never
  # asserted -- see the step that uses them for why.
  NPKC_SHA256_WORKBENCH: c84007934e6d25c94de52e9a944a63acacb24fdd3aa9fca9c7d911817b770fee
  NPKRT_SHA256_WORKBENCH: c8e5033ad17c70f838d567157738a6cc046af0ca3140ad92259fa71f0e747b4e
  # THE EMISSION AT THAT COMMIT, as the compiler's own build recorded it -- notice
  # 82's `npkc.ll` row, in ../.internal/toolchain/5fbaf4a/PIN.md. ASSERTED by the
  # step below since cycle 0.2.0a (TM-212), and moved with every pin.
  NPKC_LL_SHA256: 5630c2b4464f5628f23467b7eb775a7571f0c6b8b7f1bdc6c3974b4af5bf97be
  NPKC_LL_BYTES: 30232291

jobs:
  build:
    # Pinned, not `ubuntu-latest`, for the same reason the compiler is pinned by
    # commit: a runner image that rolls forward is an unpinned build input.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out ntime
        uses: actions/checkout@v4

      - name: Check out the pinned compiler
        uses: actions/checkout@v4
        with:
          repository: alternative-intelligence-cp/nitpick
          ref: ${{ env.NITPICK_COMMIT }}
          path: .nitpick

      # `actions/checkout` with an explicit `ref` should make this redundant.
      # It is here anyway because it is the single fact every claim in this file
      # rests on, and a claim that rests on a tool's promise rather than on a
      # measurement is the shape this repository keeps refusing.
      - name: Assert the compiler is AT the pinned commit
        run: |
          set -euo pipefail
          have="$(git -C .nitpick rev-parse HEAD)"
          if [ "$have" != "$NITPICK_COMMIT" ]; then
            echo "compiler checkout is at $have; the pin is $NITPICK_COMMIT" >&2
            exit 1
          fi
          # Nothing uncommitted, which is the other half of the workbench's
          # provenance test: a binary built from a dirty tree is a build of no
          # commit that ever existed.
          if [ -n "$(git -C .nitpick status --porcelain)" ]; then
            echo "the compiler checkout is dirty; the pin names a commit" >&2
            git -C .nitpick status --porcelain >&2
            exit 1
          fi
          echo "compiler HEAD == $have (clean)"

      # The upstream release tarball, because apt.llvm.org packages by MAJOR
      # version and would give whatever 20.1.x is current -- which is precisely
      # the pin condition (1) forbids. ~2 GB, so it is cached on the version
      # alone: the asset is immutable for a given tag.
      - name: Cache LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/llvm
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C ~/llvm

      # CONDITION (1), enforced.
      - name: Put LLVM on PATH and assert the exact patch release
        run: |
          set -euo pipefail
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/llvm/bin:$PATH"
          have="$(llvm-config --version)"
          if [ "$have" != "$LLVM_VERSION" ]; then
            echo "LLVM is $have; nitpick.toml pins $LLVM_VERSION EXACTLY." >&2
            echo "A patch release can change instruction selection, which is" >&2
            echo "why the pin names three digits and this step fails." >&2
            exit 1
          fi
          echo "llvm-config --version == $have"
          for t in llc opt ld.lld; do
            command -v "$t" >/dev/null || { echo "$t not on PATH" >&2; exit 1; }
          done

      # Keyed on the compiler's commit AND on LLVM's version, so a cache hit is
      # by construction a binary built from this commit at this LLVM.
      - name: Cache the built compiler
        id: npkc-cache
        uses: actions/cache@v4
        with:
          path: .nitpick/.internal/quickemit
          key: npkc-${{ env.NITPICK_COMMIT }}-llvm-${{ env.LLVM_VERSION }}

      # CONDITION (2), enforced. `working-directory` puts the shell at the
      # compiler tree root; the `pwd` check asserts that it did, because the
      # ladder's argument (`npkg/main.npk`) is resolved against the working
      # directory and a ladder run from anywhere else would either fail
      # confusingly or build the wrong entry.
      - name: Build the compiler from the pinned commit, FROM ITS TREE ROOT
        if: steps.npkc-cache.outputs.cache-hit != 'true'
        working-directory: .nitpick
        run: |
          set -euo pipefail
          test "$(pwd)" = "$GITHUB_WORKSPACE/.nitpick" \
            || { echo "ladder not at the compiler tree root: $(pwd)" >&2; exit 1; }
          test -f npkg/main.npk \
            || { echo "npkg/main.npk not resolvable from $(pwd)" >&2; exit 1; }
          echo "ladder root: $(pwd)"
          python3 bootstrap/harness/quickemit.py --keep npkg/main.npk

      - name: Export the toolchain, print its digests, and assert the emission
        run: |
          set -euo pipefail
          npkc="$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkc"
          npkrt="$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkrt.o"
          test -f "$npkc"  || { echo "no npkc"  >&2; exit 1; }
          test -f "$npkrt" || { echo "no npkrt" >&2; exit 1; }
          echo "NPKC=$npkc"   >> "$GITHUB_ENV"
          echo "NPKRT=$npkrt" >> "$GITHUB_ENV"
          # THE EMISSION IS ASSERTED; THE BINARIES ARE PRINTED (2026-09-27, cycle
          # 0.2.0a, TM-212 -- the ecosystem audit's EC6). The claim that holds
          # across machines is the compiler's own EMISSION, `npkc.ll` -- same
          # source, same committed snapshot builder, the same text anywhere --
          # and a version is not a binary (the compiler's D-265): the compiler
          # seat measured the `npkc` binary differing between the workbench and a
          # runner, as it may. So every artefact the ladder leaves is printed,
          # size beside digest, so the first that differs names the stage, and
          # `npkc.ll` is held to the pinned commit's row (`NPKC_LL_SHA256` and
          # `NPKC_LL_BYTES` above, notice 82's), AFTER everything is printed. A
          # difference is a compiler defect to raise through the workbench,
          # never a pin to bump. The workbench's binary digests stay printed
          # beside CI's, for that measurement's record, and are EXPECTED to
          # differ.
          #
          # UNTIL THEN THIS STEP REPORTED AND ASSERTED NOTHING, AND ITS PREMISE
          # WAS WRONG: it waited for the two BINARIES to match before promoting
          # "these four lines" to an assertion, which D-265 says need never
          # happen, and it never printed the emission at all. `nitpick-regex`'s
          # CI has asserted the same row since its cycle 0.1.0b (its RX-180), and
          # it held there on its first run. `.internal/quickemit/npkc.ll` stands
          # in for the ladder's `build/npkc.ll`: the same entry compiled by the
          # same builder, and the output directory does not enter the IR. It is
          # inside the cached directory, so a cache hit -- keyed by the commit --
          # carries it too.
          echo "the cross-machine claim is npkc.ll and nothing else on this list:"
          for f in builder.o builder npkrt.o npkc.ll npkc.o npkc; do
            p="$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/$f"
            if [ -f "$p" ]; then
              printf '%-12s %10s bytes  %s\n' \
                "$f" "$(stat -c '%s' "$p")" "$(sha256sum "$p" | cut -d' ' -f1)"
            else
              printf '%-12s %s\n' "$f" "absent"
            fi
          done
          echo "npkc   WB: $NPKC_SHA256_WORKBENCH (a binary: expected to differ, D-265)"
          echo "npkrt  WB: $NPKRT_SHA256_WORKBENCH"
          echo "built from compiler ${NITPICK_COMMIT_SHORT} at LLVM ${LLVM_VERSION}"
          ll="$GITHUB_WORKSPACE/.nitpick/.internal/quickemit/npkc.ll"
          test -f "$ll" || { echo "no npkc.ll: the emission cannot be held to the pin" >&2; exit 1; }
          have="$(sha256sum "$ll" | cut -d' ' -f1)"
          size="$(stat -c '%s' "$ll")"
          if [ "$have" != "$NPKC_LL_SHA256" ] || [ "$size" != "$NPKC_LL_BYTES" ]; then
            echo "npkc.ll is $size B / $have; the pin's emission is $NPKC_LL_BYTES B / $NPKC_LL_SHA256." >&2
            echo "The emission is the cross-machine claim (the compiler's D-265): a compiler defect to raise." >&2
            exit 1
          fi
          echo "npkc.ll == the pin's emission, $size B / $have"

      # THE FULL INVOCATION, AND NO FLAGS -- WHICH IS A RULE (TM-125, B-9b), NOT
      # AN OMISSION. `--quick` skips the `sweep` stage, and `TESTING.md` V-2
      # makes the exhaustive sweeps THE gate for every property that can be
      # checked over its whole domain; V-3 calls the civil sweep the strongest
      # statement this library makes. A CI run that skipped it would publish a
      # green badge for something no run had checked. `--only` is worse: it
      # concludes nothing by construction and says so twice.
      #
      # The argument is deliberately NOT "the sweeps are cheap". They are, and
      # that would stop being an argument the moment one got slow -- which is
      # exactly when somebody under deadline would reach for the flag.
      #
      # This step has not changed since cycle 0.0.1 and will not, which is the
      # point of invoking the runner rather than a list of commands: the runner
      # grew from four hardcoded checks to nine stages underneath it.
      - name: Run the harness
        run: |
          # `set +e` EXPLICITLY, AND IT IS NOT REDUNDANT (TM-146). The runner's
          # exit status is CAPTURED, on its own line, with no pipeline between
          # it and the command -- `$?` after a pipeline is the last command's
          # status, and a `| tee` here would report tee's.
          #
          # THIS LINE READ `set -uo pipefail` AND THE COMMENT SAID "NOT
          # `set -e`", AND THE COMMENT WAS FALSE. GitHub's default shell for a
          # `run:` block is `/usr/bin/bash -e {0}` -- `-e` is already on when
          # the script starts, and `set -uo pipefail` does not clear it. So on
          # the FIRST CI run this repository ever had, the harness exited 1 and
          # the shell died on that line: `status=$?` never ran, `cat "$log"`
          # never ran, and the step reported exit 1 with NO OUTPUT AT ALL. The
          # log capture this block exists for did not exist.
          #
          # It is the same defect this workflow is full of comments about --
          # a mechanism whose description is wider than its behaviour -- and it
          # could only be found by running, which is why the first run was
          # worth having even though it was red.
          set +e
          set -uo pipefail
          log="$RUNNER_TEMP/harness.log"
          python3 harness/run.py > "$log" 2>&1
          status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          # AND THE SUMMARY IS ASSERTED, NOT JUST THE STATUS. A filtered run
          # exits 0 too -- it prints `GREEN under --only …` or `GREEN under
          # --quick …` and then says twice that it concludes nothing. Only a
          # full invocation prints the unqualified line, so this is TM-125 made
          # mechanical: a future edit that adds a flag to the command above
          # turns this step red instead of quietly weakening the badge.
          if ! grep -q '^GREEN -- ' "$log"; then
            echo "the harness did not print the UNQUALIFIED green summary." >&2
            echo "CI runs the full suite: no --quick, no --only (TM-125, B-9b)." >&2
            exit 1
          fi
