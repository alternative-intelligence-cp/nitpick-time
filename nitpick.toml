# ntime — the manifest.
#
# The schema is the compiler's (BUILD_REFERENCE.md §1, D-077): four tables plus
# the `[[test]]` array, and `npkg`'s parser refuses a key the schema lacks. It
# is written in full now, ahead of the tool that reads it, because a manifest
# that appears when the tooling arrives is a manifest nobody reviewed.
#
# WHAT CANNOT READ THIS YET. `npkg build` is the compiler's own bootstrap
# ladder — it assembles `runtime/npkrt.ll` and `bootstrap/seed/stage1.ll`, has
# the builder compile `[build] entry`, and names the result `npkc`. There is no
# generic-project path, and `[dependencies]` is parsed but the resolver's root
# list is initialised empty and never populated, so a `use "ntime/…"` path
# resolves against nothing. Until that changes, `harness/` builds this library
# by invoking `npkc`, `llc` and `ld.lld` directly — the same relationship
# `bootstrap/harness/` has to `npkg` in the compiler repo, and it retires the
# same way. See meta/specs/BUILD.md.

[project]
name        = "ntime"
version     = "0.0.0"
description = "Dates, times and time zones for Nitpick — zero dependency, no libc, no system tzdb"
authors     = ["Randy"]
target      = "library"

[build]
entry     = "src/lib.npk"
output    = "build/libntime"
# 0 while the library is being built out, matching the compiler's own choice:
# `opt` is not invoked at all, the pipeline stays short, and the emitted IR
# stays readable. The harness re-runs every program through `opt -O2` as a
# CHECK regardless (the 1.3.8 instrument), which is where optimiser divergence
# gets caught — raising this key is a separate decision from running that leg.
opt-level = 0

# THE TOOLCHAIN IS A BUILD INPUT (D-204), pinned to the exact patch release the
# compiler pins, because a patch release may change instruction selection. These
# lists are READ by every `llc`/`opt`/`ld.lld` invocation the harness makes; a
# stated flag nothing consumes is the next stale document.
[toolchain]
llvm          = "20.1.2"
llc-flags     = ["-O0", "-filetype=obj", "-relocation-model=static"]
llc-opt-flags = ["-O2", "-filetype=obj", "-relocation-model=static"]
opt-flags     = ["-O2", "-S"]
lld-flags     = ["-static"]

# EMPTY, AND EMPTY ON PURPOSE. `ntime` depends on the language and its prelude
# and on nothing else — not on the compiler's `src/`, not on `lib/`, and not on
# `nitpick-parse` even though the two overlap on datetime scanning (O-X1).
# Anything added here is a zero-dependency decision and has to be argued as one
# (meta/specs/BUILD.md §4).
[dependencies]

# TEST TARGETS. Each cycle adds its own entries as its suite is created; an
# entry naming a directory with nothing in it is a suite that reports green
# while checking nothing, which is the failure this table exists to prevent.
# The stages are the compiler's (BUILD_REFERENCE §7.1) and the expectation
# grammar lives inside each test file.
#
# AND THE OTHER HALF OF THAT RULE, LEARNED AT 0.0.1: an entry whose `kind`
# disagrees with the files under its path is worse than an empty one, because
# it fails for a reason that is not the library's. `tests/probe/` holds 28
# positive probes [[sweep: probe_exit=28]] and 21 that MUST NOT COMPILE
# [[sweep: probe_error=21]], and the schema selects by
# directory, never by file (the compiler's runner globs `<path>/*.npk`). That
# was O-X7, and it is SETTLED as TM-119: within a `program` entry the runner
# dispatches on each FILE'S OWN HEADER -- `expect-error:` makes it a refusal
# member, `expect-exit:` a run member, neither is a failure rather than a skip.
# `meta/specs/BUILD.md` B-4c carries the rule and the migration cost, since it
# is a deliberate divergence from `npkg`'s per-entry `kind`.

# THE PROBES. Stage `program`: emitted, scanned, assembled, linked, run at -O0
# and again through `opt -O2`, the same exit required both times (B-3).
#
# NOT `recursive`, and the omission is the point: a plain glob is
# `tests/probe/*.npk`, which is exactly the 49 probe programs
# [[sweep: probe_dir=49]] and EXCLUDES the two subdirectories that must never
# be run as tests --
#   tests/probe/support/  three library modules probe 11 imports. No `main`,
#                         no `failsafe`; running one is not a thing to do.
#   tests/probe/defect/   reproductions of compiler defects. Several are
#                         SUPPOSED to be refused, and two of them are now
#                         regression cases for a refusal that has landed.
# `recursive = true` here would sweep both, so the default is load-bearing and
# is stated rather than left to be rediscovered (0.0.3's checklist asks for
# exactly this exclusion, with the reason written next to it).
#
# THE SEVEN REFUSAL MEMBERS OF THIS ENTRY, named so the split is greppable
# rather than counted (the count came from the command, not from reading the
# names -- `probe05b_derive_eq_refused.npk` is called `_refused` and is a
# POSITIVE regression case since O-N10 was fixed, which is exactly how an
# eyeballed count goes wrong): probe02c_narrow_refused, probe02d_wide_literal_refused,
# probe10b_view_of_temporary_refused, probe10c_view_of_move_param_refused,
# probe11b_arm_omitted_refused, probe11c_import_arm_cost,
# probe11e_unused_import_refused. Each carries `// expect-error:` instead of
# `// expect-exit:`, and under TM-119 the runner reads that and holds the file
# to B-7's equal-sets rule instead of linking it. RE-MEASURED AT CYCLE 0.0.6
# AND TAGGED SO IT CANNOT GO STALE AGAIN (TM-142): 32 files, 25 and 7, none
# with both markers and none with neither. The names above are the SEVEN as of
# 0.0.2 and the split has not moved; every probe added since carries
# `expect-exit:`.
[[test]]
name  = "probe"
stage = "program"
path  = "tests/probe"

# THE STAGES THAT HAVE NO ENTRY HERE, AND WHY EACH ABSENCE IS DELIBERATE. An
# entry naming an empty directory is refused (see above), so the absence is the
# correct spelling until there is something to run — but an absence nobody
# wrote down is indistinguishable from an omission, which is the whole of
# TM-115.
#
#   `parse`   HAS NO ENTRY BY DESIGN, not by omission (TM-123). It is a
#             WHOLE-TREE stage: `BUILD.md` §3's Directory column for it reads
#             "every `.npk` in the tree", and that is where its value is — of
#             the 127 files here [[sweep: npk_total=127]], 41 are put in front of
#             the compiler by nothing
#             else. An entry would narrow it to one directory and silently
#             un-cover the rest, so `stage = "parse"` is REFUSED BY NAME.
#   `accept`  DECLINED, not unimplemented (TM-124, B-4b). It stops at "accepted
#             in silence", which is the shape a program with no `failsafe`
#             walks through; `tests/probe/defect/missing_failsafe/` is the
#             reproduction. Refused by name, naming `compile`/`positive`
#             instead.
#   `check`   IMPLEMENTED, and `tests/rejection/` is empty: every refusal this
#             library has today is a probe under `tests/probe/`, dispatched by
#             its own header (B-4c). The stage is exercised on every run by
#             `selfcheck.py` cases 2 and 3, and gains an entry when the library
#             has a refusal of its own to assert — cycle 0.0.4.
#   `golden`  IMPLEMENTED, and `tests/golden/` is empty: nothing formats
#             anything yet. Exercised by `selfcheck.py` case 4. Its entry
#             arrives with `fmt` at cycle 0.4.
#   `sweep`   HAS AN ENTRY SINCE CYCLE 0.1.2, below the unit tests. Until
#             then this line read "IMPLEMENTED, and `tests/unit/sweep/` is
#             empty", and `--quick` had nothing to skip.

# THE UNIT TESTS. Stage `program`, added at cycle 0.0.4 with the first library
# code -- `src/core/`. Before 0.0.4 this directory was EMPTY and had no entry,
# which is the rule stated at the top of this table: an entry naming a directory
# with nothing in it reports green while checking nothing.
#
# NOT `recursive`, exactly as `probe` is not, and for the same reason: the plain
# glob is `tests/unit/*.npk` and it EXCLUDES `tests/unit/sweep/`, which has its
# own `sweep` entry below since cycle 0.1.2. Recursive, this entry would run
# the sweeps a second time as `program` members, where their
# `sweep-count` is an expectation that does nothing -- a failure (B-5e) --
# instead of as the `sweep` members they are.
#
# SEVEN FILES AT 0.0.4, and the split is NAMED rather than counted, because a
# count taken from the command instead of from the names is how the probe entry
# went wrong once (see above). Written out so the arithmetic can be checked:
#
#     7 = 4 at `expect-exit: 0`  (bytes_growth, bytes_put_int, limits_named,
#                                 vec_boundaries)
#       + 3 at `expect-exit: 94` (vec_at_past_end, vec_pop_empty,
#                                 vec_set_past_end)
#
# The three 94s are `OutOfBounds` from the TM-129 guard, one per accessor path
# that can be indexed out of range: read, write, and pop-from-empty. They are
# separate files because a program that exits 0 cannot also take a trap.
[[test]]
name  = "unit"
stage = "program"
path  = "tests/unit"

# THE SWEEPS -- cycles 0.1.2, 0.1.3 and 0.1.4: cycle 0.1's gate, and the civil
# cross-oracle (`CALENDAR.md` C-14 ... C-18; `TESTING.md` V-2, V-3, V-6). Stage `sweep`: as `program`, both legs, and each
# program must PRINT the count it visited, equal to the `sweep-count` its
# header declares (TM-122) -- an exhaustive loop that returned early exits 0
# exactly like one that finished. Separable, never optional: `--quick` skips
# this entry LOUDLY and concludes nothing, and CI never passes it (B-9, B-9b).
#
# SIX MEMBERS, ONE DOMAIN EACH, and each domain is TAGGED here and wherever
# a specification states it, so `check_denominators` diffs every statement
# against the header that declares it (`TESTING.md` V-1h):
#
#   every_day_number.npk     each day number to its date and back
#                            [[sweep: domain_every_day_number=7304484]]
#   every_civil_date.npk     each date to its day number and back, each
#                            number the last one's plus one, and -- since
#                            cycle 0.1.3 -- each weekday the count's
#                            [[sweep: domain_every_civil_date=7304484]]
#   every_month_length.npk   each month's length, two ways
#                            [[sweep: domain_every_month_length=239988]]
#   every_ordinal_date.npk   each date's day of the year against a count, and
#                            back from the count (cycle 0.1.3)
#                            [[sweep: domain_every_ordinal_date=7304484]]
#   every_iso_week_date.npk  each date's ISO week date against a walk of
#                            ISO 8601's rule, and back from the walk (0.1.3)
#                            [[sweep: domain_every_iso_week_date=7304484]]
#   every_oracle_date.npk    each date of years 1 ... 9999 against Python's
#                            `datetime`, by a digest per year (0.1.4): the
#                            cross-oracle, which trusts Python and so is not
#                            the gate (`TESTING.md` V-6)
#                            [[sweep: domain_every_oracle_date=3652059]]
[[test]]
name  = "sweep"
stage = "sweep"
path  = "tests/unit/sweep"

# THE CONSUMER. Stage `compile`, `kind = "positive"` -- which in the compiler's
# vocabulary means "compiles, links, runs, and exits with the expected code",
# NOT "was accepted". The distinction is this repository's own O-N11: `npkc`
# exit 0 is not well-formedness, and a stage that stops at acceptance passes a
# program with no `failsafe`. `tests/probe/defect/missing_failsafe/` is the
# proof, and it is why this entry is not `stage = "accept"`.
[[test]]
name  = "conformance"
stage = "compile"
kind  = "positive"
path  = "tests/conformance"
